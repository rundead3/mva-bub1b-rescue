name: Validate research repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce sequence analysis
        run: |
          python src/rescue_map.py
          git diff --exit-code -- results/
      - name: Check publication contents
        run: python scripts/check_release.py
